name: Scheduled daily commits

on:
  schedule:
    - cron: '0 12 * * *' # daily at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure scheduled branch exists locally
        run: |
          if git ls-remote --heads origin scheduled-commits; then
            git fetch origin/scheduled-commits
            git checkout scheduled-commits
          else
            git checkout -b scheduled-commits
          fi

      - name: Read counter
        id: counter
        run: |
          if [ -f .github/commit-counter ]; then
            echo "COUNTER=$(cat .github/commit-counter)" >> $GITHUB_OUTPUT
          else
            echo "COUNTER=0" >> $GITHUB_OUTPUT
          fi

      - name: Stop if all commits done
        if: ${{ fromJson(steps.counter.outputs.COUNTER) >= 12 }}
        run: echo "All 12 commits already made"

      - name: Create next daily file from messages and increment counter
        run: |
          set -e
          if [ ! -f .github/daily-commit-messages.txt ]; then
            echo "Missing .github/daily-commit-messages.txt" >&2
            exit 1
          fi
          COUNTER=$(cat .github/commit-counter 2>/dev/null || echo 0)
          NEXT=$((COUNTER+1))
          TOTAL=$(wc -l < .github/daily-commit-messages.txt | tr -d ' ')
          if [ "$NEXT" -gt "$TOTAL" ]; then
            echo "All $TOTAL commits already scheduled"
            exit 0
          fi
          LINE=$(sed -n "${NEXT}p" .github/daily-commit-messages.txt)
          TITLE=$(printf '%s' "$LINE" | cut -d '|' -f1)
          BODY=$(printf '%s' "$LINE" | cut -d '|' -f2-)
          mkdir -p docs
          echo "# $TITLE" > docs/daily-$NEXT.md
          echo "" >> docs/daily-$NEXT.md
          echo "$BODY" >> docs/daily-$NEXT.md
          echo "$NEXT" > .github/commit-counter
          git add docs/daily-$NEXT.md .github/commit-counter
          git commit -m "Day $NEXT: $TITLE" || echo "No changes to commit"
          git push origin scheduled-commits
