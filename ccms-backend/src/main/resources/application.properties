spring.application.name=ccms-backend

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${PORT:8082}

# ---------------------------------------------------------------------------
# MySQL
# ---------------------------------------------------------------------------
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/complaint?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:complaint_user}
spring.datasource.password=${MYSQL_PASSWORD:Complaint@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
# Must be Base64-safe and at least 256 bits for HS256. Set via env var in real deployments.
app.jwt.secret=${JWT_SECRET:super_secret_change_me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ---------------------------------------------------------------------------
# CORS (replaces the cors() config in server.js)
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://campus-client.onrender.com}

# ---------------------------------------------------------------------------
# Frontend URL used to build the password-reset link
# ---------------------------------------------------------------------------
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---------------------------------------------------------------------------
# Mail (replaces SendGrid/nodemailer). Defaults assume Gmail SMTP with an app password,
# matching EMAIL_USER / EMAIL_PASS from the original .env.
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${EMAIL_USER:campuscomplaintmanagementsyste@gmail.com}
spring.mail.password=${EMAIL_PASS:ltec bsir deoz ierl}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from-name=Campus Complaint System
app.mail.from-address=${EMAIL_USER:no-reply@ccms.local}

# ---------------------------------------------------------------------------
# Admin seeding (replaces seeder/adminSeeder.js). Runs once on startup, skips
# any admin whose email already exists.
# ---------------------------------------------------------------------------
app.seed.admins[0].name=Super Admin
app.seed.admins[0].email=${SEED_ADMIN1_EMAIL:admin1@rgukt.ac.in}
app.seed.admins[0].password=${SEED_ADMIN1_PASSWORD:admin@123}
app.seed.admins[1].name=System Admin
app.seed.admins[1].email=${SEED_ADMIN2_EMAIL:admin2@rgukt.ac.in}
app.seed.admins[1].password=${SEED_ADMIN2_PASSWORD:Admin@123}

# ---------------------------------------------------------------------------
# Jackson
# ---------------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
